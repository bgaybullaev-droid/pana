<!DOCTYPE html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ labels.gone_title }} — UcharMarket</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 40px 16px; background: #f8fafc; color: #1f2937; text-align: center; }
