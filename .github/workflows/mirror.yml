name: Mirror to hasanoff507

# Bu repoga (bgaybullaev-droid/ucharmarket-frontend) har qanday push bo'lganda
# kodni avtomatik hasanoff507/ucharmarket-frontend ga ko'chiradi (mirror qiladi).

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    # Mirror faqat manba repoda (bgaybullaev-droid) ishlaydi. Bu workflow
    # hasanoff507 ga ham ko'chiriladi, lekin u yerda ishlamasligi kerak
    # (o'zini-o'ziga push qilmasligi va MIRROR_TOKEN talab qilmasligi uchun).
    if: github.repository == 'bgaybullaev-droid/ucharmarket-frontend'
    steps:
      - name: Clone source (full mirror)
        run: |
          git clone --mirror \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            repo.git

      - name: Push to hasanoff507
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          cd repo.git
          # Faqat branch va taglarni mirror qilamiz; refs/pull/* (GitHub hidden refs)
          # ni chetlab o'tamiz, aks holda "deny updating a hidden ref" xatosi chiqadi.
          # --prune manbada o'chirilgan branchlarni nishonda ham o'chiradi.
          git push --force --prune \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/hasanoff507/ucharmarket-frontend.git" \
            "refs/heads/*:refs/heads/*" \
            "refs/tags/*:refs/tags/*"
