name: Deploy to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'db/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Deploy faqat asosiy repoda (hasanoff507) ishlaydi. Mirror (bgaybullaev)
    # da bu job skip bo'ladi, shuning uchun u yerda VPS secretlar kerak emas.
    if: github.repository == 'hasanoff507/ucharmarket-frontend'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: OPENAI_API_KEY
          command_timeout: 30m
          script: |
            set -e
            cd /home/kvm/project/ucharmarket/_repo
            git fetch origin main
            git reset --hard origin/main
            cd /home/kvm/project/ucharmarket

            # Sync frontend (full overwrite)
            rsync -av --delete _repo/frontend/ frontend/

            # Sync backend (preserve .env, uploads, caches)
            rsync -av --delete \
              --exclude='.env' \
              --exclude='.env.test' \
              --exclude='.env.local' \
              --exclude='uploads/' \
              --exclude='__pycache__/' \
              --exclude='.pytest_cache/' \
              --exclude='.ruff_cache/' \
              --exclude='.mypy_cache/' \
              --exclude='.claude/' \
              --exclude='.playwright-mcp/' \
              --exclude='celerybeat-schedule' \
              --exclude='*.pyc' \
              _repo/backend/ backend/

            # Sync db (SQL dumps / schema snapshots)
            rsync -av --delete _repo/db/ db/

            # Inject secrets from GitHub into backend/.env (idempotent).
            # Track whether the file actually changed: docker compose does NOT
            # recreate a container when only env_file *content* changes, so we
            # force a recreate below only when the key was added/updated.
            ENV_CHANGED=0
            if [ -n "$OPENAI_API_KEY" ]; then
              if grep -Fqx "OPENAI_API_KEY=$OPENAI_API_KEY" backend/.env 2>/dev/null; then
                : # already present with the correct value — nothing to do
              else
                # Drop any stale line, then append the current value. Using
                # grep -v + echo (not sed) avoids issues with special chars
                # in the key; cp-over preserves the original file permissions.
                grep -v "^OPENAI_API_KEY=" backend/.env > backend/.env.tmp 2>/dev/null || true
                echo "OPENAI_API_KEY=$OPENAI_API_KEY" >> backend/.env.tmp
                cp backend/.env.tmp backend/.env && rm -f backend/.env.tmp
                ENV_CHANGED=1
              fi
            fi

            # Drop any zombie containers left by a previous failed recreate
            # (docker renames the old one to "<hash>_demo-X" when conflict hits)
            docker ps -a --format '{{.Names}}' \
              | grep -E '^[0-9a-f]+_demo-' \
              | xargs -r docker rm -f

            # Rebuild and restart all services
            docker compose up -d --build --remove-orphans

            # If backend/.env changed, force a recreate so running containers
            # re-read the updated env_file (a plain `up -d` would skip them).
            if [ "$ENV_CHANGED" = "1" ]; then
              docker compose up -d --force-recreate
            fi

            # Apply database migrations
            docker compose run --rm api alembic upgrade head

            # Rebuild the Meilisearch index (native + crawled Telegram/OLX).
            # Meili data does not survive a container rebuild, so repopulate
            # it on every deploy instead of relying on the Celery beat
            # reconcile. Idempotent + safe-fallback; `|| true` so a search
            # hiccup never fails the deploy (the script itself always exits 0).
            docker compose run --rm api python scripts/backfill_meilisearch.py || true

            # Cleanup old images
            docker image prune -f
